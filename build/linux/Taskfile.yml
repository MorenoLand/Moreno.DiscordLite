version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
    cmds:
      - go build -tags "production devtools" -trimpath -buildvcs=false -ldflags="-w -s" -o {{.BIN_DIR}}/{{.APP_NAME}}
    env:
      GOOS: linux
  package:
    cmds:
      - task: build
  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
